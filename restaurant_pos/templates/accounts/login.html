{% extends 'base.html' %}

{% block title %}Login - RestoPOS{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 60px);">
    <div class="glass-card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
        <h2 style="margin-bottom: 1.5rem; text-align: center; color: var(--primary);">Welcome Back</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Sign in to your account</p>
        
        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">Username</label>
                <input type="text" name="username" required 
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem;">
            </div>
            <div style="margin-bottom: 2rem;">
                <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">Password</label>
                <input type="password" name="password" required 
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem;">
            </div>
            
            {% if form.errors %}
                <div style="color: #ef4444; font-size: 0.875rem; margin-bottom: 1rem; text-align: center;">
                    Invalid username or password.
                </div>
            {% endif %}
            
            <button type="submit" 
                    style="width: 100%; padding: 0.75rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s;">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
