{% extends "base.html" %}
{% block title %}Login | Restaurant POS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Sign in to POS</h1>
                <p class="text-muted small">Use the demo superuser created by the seed command or your own Django admin account.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input class="form-control" type="text" name="username" autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input class="form-control" type="password" name="password">
                    </div>
                    <button class="btn btn-dark w-100" type="submit">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
